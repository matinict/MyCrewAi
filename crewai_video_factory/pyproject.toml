[project]
name = "crewai_video_factory"
version = "0.1.0"
description = "crewai_video_factory using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
#requires-python = ">=3.10,<3.13"
requires-python = ">=3.11,<3.12"
dependencies = [
  "crewai[anthropic,google-genai]==1.8.1",
  "crewai-tools>=0.17.0,<1.0.0",
  "pandas>=2.0.0,<3.0.0",  # Add this line
  "langchain-core==0.3.37",
  "matplotlib>=3.7.0",
  "bar_chart_race>=0.1.0",
  "static-ffmpeg>=3.0",
  "litellm>=1.75.3",
  "gtts>=2.5.4",
  "dashscope>=1.25.13",
  "edge-tts>=7.2.7",
  "piper-tts>=1.4.1",
  "huggingface-hub>=0.36.2",
  "google-api-python-client>=2.192.0",
  "google-auth>=2.48.0",
  "google-auth-oauthlib>=1.3.0",
  "google-auth-httplib2>=0.3.0",
]

[tool.uv]
environments = [
  "sys_platform == 'linux'"
]

override-dependencies = [
    "langchain-core==0.3.37",
]


[project.scripts]
crewai_video_factory = "crewai_video_factory.main:run"
run_crew = "crewai_video_factory.main:run"
train = "crewai_video_factory.main:train"
replay = "crewai_video_factory.main:replay"
test = "crewai_video_factory.main:test"
run_with_trigger = "crewai_video_factory.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
