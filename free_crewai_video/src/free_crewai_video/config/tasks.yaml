analyze_topic:
  description: >
    Analyze the input topic and decide:
    - time range
    - entities
    - metric
  expected_output: Clear data schema
  agent: topic_analyst

research_data:
  description: >
    Generate realistic historical time-series data in JSON format.
    Structure:
    {
      "year": [],
      "Entity1": [],
      "Entity2": []
    }
  expected_output: JSON data
  agent: data_researcher

format_data:
  description: >
    Convert the JSON data into CSV format.
    First column must be "year".
    Save to data/data.csv
  expected_output: CSV file saved
  agent: data_engineer

generate_video:
  description: >
    Use Python to generate an animated bar chart race MP4
    from data/data.csv and save to output/output.mp4
  expected_output: MP4 video
  agent: video_generator
